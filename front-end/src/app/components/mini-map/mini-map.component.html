@if (view(); as v) {
  <div class="mini-map" aria-label="Mini-map">
    <div class="mini-map__header">
      <div class="mini-map__title">Map</div>
      <svg class="mini-map__compass" viewBox="0 0 32 32" width="52" height="52" role="img" aria-label="Compass: north is up">
        <title>North is up</title>
        <circle class="mini-map__compass-ring" cx="16" cy="16" r="13" />
        <polygon class="mini-map__compass-needle mini-map__compass-needle--n" points="16,10 14,16 18,16" />
        <polygon class="mini-map__compass-needle mini-map__compass-needle--s" points="16,22 14,16 18,16" />
        <text class="mini-map__compass-label mini-map__compass-label--n" x="16" y="7" text-anchor="middle" dy="0.35em">N</text>
        <text class="mini-map__compass-label" x="25" y="16" text-anchor="middle" dy="0.35em">E</text>
        <text class="mini-map__compass-label" x="16" y="25" text-anchor="middle" dy="0.35em">S</text>
        <text class="mini-map__compass-label" x="7" y="16" text-anchor="middle" dy="0.35em">W</text>
      </svg>
    </div>
    <div class="mini-map__viewport">
      <svg
        class="mini-map__svg"
        [attr.viewBox]="'0 0 ' + v.width + ' ' + v.height"
        [attr.width]="v.width"
        [attr.height]="v.height"
        role="img"
        aria-label="Local area map"
      >
        <g class="mini-map__edges">
          @for (e of v.edges; track e.key) {
            <line
              [attr.x1]="e.x1"
              [attr.y1]="e.y1"
              [attr.x2]="e.x2"
              [attr.y2]="e.y2"
              class="mini-map__edge"
            />
          }
        </g>
        <g class="mini-map__nodes">
          @for (n of v.nodes; track n.id) {
            <g
              class="mini-map__node"
              [class.mini-map__node--current]="n.isCurrent"
              [class.mini-map__node--shop]="n.kind === 'shop'"
              [class.mini-map__node--recall]="n.kind === 'recall'"
              [class.mini-map__node--dark]="n.kind === 'dark'"
              [class.mini-map__node--temple]="n.kind === 'temple'"
              [class.mini-map__node--forest]="n.kind === 'forest'"
              [class.mini-map__node--water]="n.kind === 'water'"
              [class.mini-map__node--danger]="n.kind === 'danger'"
              [attr.transform]="'translate(' + n.cx + ',' + n.cy + ')'"
              [attr.aria-label]="n.name + (n.isCurrent ? ' (you are here)' : '')"
            >
              <title>{{ n.name }}{{ n.isCurrent ? ' (you are here)' : '' }}</title>
              <rect
                class="mini-map__node-bg"
                [attr.x]="-nodeRadius"
                [attr.y]="-nodeRadius"
                [attr.width]="nodeRadius * 2"
                [attr.height]="nodeRadius * 2"
                rx="4"
                ry="4"
              />
              <text class="mini-map__node-glyph" text-anchor="middle" dy="0.35em">{{ n.glyph }}</text>
              @if (n.hasUp) {
                <text class="mini-map__node-badge mini-map__node-badge--up" [attr.x]="nodeRadius - 2" [attr.y]="-nodeRadius + 6" text-anchor="end">↑</text>
              }
              @if (n.hasDown) {
                <text class="mini-map__node-badge mini-map__node-badge--down" [attr.x]="nodeRadius - 2" [attr.y]="nodeRadius - 2" text-anchor="end">↓</text>
              }
            </g>
          }
        </g>
      </svg>
    </div>
  </div>
} @else {
  <div class="mini-map mini-map--empty" aria-label="Mini-map">
    <div class="mini-map__header">
      <div class="mini-map__title">Map</div>
      <svg class="mini-map__compass" viewBox="0 0 32 32" width="52" height="52" role="img" aria-label="Compass: north is up">
        <title>North is up</title>
        <circle class="mini-map__compass-ring" cx="16" cy="16" r="13" />
        <polygon class="mini-map__compass-needle mini-map__compass-needle--n" points="16,10 14,16 18,16" />
        <polygon class="mini-map__compass-needle mini-map__compass-needle--s" points="16,22 14,16 18,16" />
        <text class="mini-map__compass-label mini-map__compass-label--n" x="16" y="7" text-anchor="middle" dy="0.35em">N</text>
        <text class="mini-map__compass-label" x="25" y="16" text-anchor="middle" dy="0.35em">E</text>
        <text class="mini-map__compass-label" x="16" y="25" text-anchor="middle" dy="0.35em">S</text>
        <text class="mini-map__compass-label" x="7" y="16" text-anchor="middle" dy="0.35em">W</text>
      </svg>
    </div>
    <div class="mini-map__placeholder">Exploring…</div>
  </div>
}
